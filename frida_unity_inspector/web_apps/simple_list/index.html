<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frida Unity Inspector - Simple List</title>
    <style>
        body {
            font-family: Consolas, monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            margin: 0;
            padding: 1rem 2rem;
        }
        h1 { font-size: 1.3rem; }
        h2 {
            font-size: 1.1rem;
            border-bottom: 1px solid #3c3c3c;
            padding-bottom: 0.25rem;
        }
        section { margin-bottom: 1.5rem; }
        .pill {
            display: inline-block;
            padding: 0.1rem 0.5rem;
            border-radius: 0.75rem;
            font-size: 0.85rem;
            background: #3c3c3c;
            margin: 0.1rem;
        }
        .ok { background: #1e5c2f; }
        .bad { background: #6e2222; }
        .muted { color: #808080; }
        .error { color: #f48771; }
        ul { margin: 0.25rem 0; padding-left: 1.5rem; }
        li { margin: 0.1rem 0; }
        .node-meta { color: #808080; font-size: 0.85rem; }
        .inactive > summary { opacity: 0.5; }
        button {
            font-family: inherit;
            background: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #555;
            border-radius: 0.25rem;
            padding: 0.2rem 0.75rem;
            cursor: pointer;
        }
        button:hover { background: #4c4c4c; }

        /* -- scenes -- */
        .scene { margin-bottom: 1rem; }
        .scene + .scene { border-top: 1px solid #3c3c3c; padding-top: 0.75rem; }
        .scene-header { margin-bottom: 0.25rem; }
        .scene-header b { color: #4ec9b0; }

        /* -- scene tree -- */
        details.node, details.component {
            margin: 0.15rem 0;
            border-left: 1px solid #3c3c3c;
            padding-left: 0.5rem;
        }
        details.node > summary, details.component > summary {
            cursor: pointer;
            padding: 0.1rem 0.25rem;
            border-radius: 0.25rem;
        }
        details.node > summary:hover, details.component > summary:hover { background: #2a2a2a; }
        details.node > summary b { color: #dcdcaa; }
        details.component { border-left-color: #2f4f6f; }
        details.component > summary { color: #9cdcfe; }
        .node-body, .component-body { padding-left: 1.25rem; }
        .section-label { color: #808080; font-size: 0.85rem; margin-top: 0.25rem; }

        /* -- property rows -- */
        .prop-row {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            padding: 0.1rem 0.25rem;
            border-radius: 0.25rem;
            flex-wrap: wrap;
        }
        .prop-label {
            min-width: 10rem;
            color: #c8c8c8;
        }
        .prop-kind { color: #6a6a6a; font-size: 0.75rem; }
        .prop-source { font-size: 0.75rem; cursor: default; }
        .prop-source-field { color: #6a6a6a; }
        .prop-source-accessor { color: #569cd6; }
        .prop-source-synthetic { color: #ce9178; }
        .prop-row input[type="number"],
        .prop-row input[type="text"],
        .prop-row select {
            font-family: inherit;
            font-size: 0.85rem;
            background: #2a2a2a;
            color: #d4d4d4;
            border: 1px solid #555;
            border-radius: 0.25rem;
            padding: 0.1rem 0.3rem;
        }
        .prop-row input[type="number"] { width: 5.5rem; }
        .prop-row input[type="text"] { width: 12rem; }
        .prop-row input:disabled, .prop-row select:disabled { opacity: 0.5; }
        .field-label { color: #808080; font-size: 0.8rem; }
        .field-group { display: inline-flex; align-items: baseline; gap: 0.25rem; flex-wrap: wrap; }
        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(4, auto);
            gap: 0.15rem;
        }
        .color-swatch {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 1px solid #555;
            border-radius: 0.2rem;
            vertical-align: middle;
        }
        .json-input { width: 24rem !important; }

        .flash-ok { background: #1e5c2f55; transition: background 0.15s; }
        .flash-err { background: #6e222288; transition: background 0.15s; }
    </style>
</head>
<body>
    <h1>Frida Unity Inspector <span class="muted">- Simple List</span></h1>
    <button id="refresh">Refresh</button>
    <span id="live" class="pill bad" title="WebSocket connection for realtime updates">LIVE: OFF</span>

    <section>
        <h2>API Status</h2>
        <div id="status" class="muted">Loading...</div>
    </section>

    <section>
        <h2>Game Context</h2>
        <div id="game-context" class="muted">Loading...</div>
    </section>

    <section>
        <h2>Loaded Scenes</h2>
        <div>
            <button id="expand-all">Expand all</button>
            <button id="collapse-all">Collapse all</button>
        </div>
        <div id="scenes" class="muted">Loading...</div>
    </section>

    <script>
        let layerNames = {};

        // Keyed element registries - live updates patch these in place instead of
        // rebuilding the DOM, so expand/collapse state and in-progress edits survive.
        const nodeEls = new Map();      // gameobject id -> {details, nameEl, activeCheckbox, metaEl, componentsLabel, componentsWrap, childrenLabel, childrenWrap, summary}
        const componentEls = new Map(); // component id -> {details, summary, enabledCheckbox, nameEl, typeEl, body, objectId, signature, rows: Map(label -> {row, update})}

        async function fetchJson(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`${url} -> HTTP ${res.status}`);
            return res.json();
        }

        async function postJson(url, body) {
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });
            if (!res.ok) {
                let detail = `HTTP ${res.status}`;
                try {
                    const data = await res.json();
                    if (data.detail) detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
                } catch { /* keep generic detail */ }
                throw new Error(detail);
            }
            return res.json();
        }

        function el(tag, className, text) {
            const e = document.createElement(tag);
            if (className) e.className = className;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function showError(container, level, err) {
            container.replaceChildren(el("div", "error", `${level} - Failed to load: ${err.message}`));
        }

        function flash(element, ok) {
            element.classList.remove("flash-ok", "flash-err");
            void element.offsetWidth; // restart the transition
            element.classList.add(ok ? "flash-ok" : "flash-err");
            setTimeout(() => element.classList.remove("flash-ok", "flash-err"), 900);
        }

        function renderStatus(container, status) {
            container.replaceChildren();
            const pill = el("span", `pill ${status.running ? "ok" : "bad"}`, status.running ? "RUNNING" : "STOPPED");
            container.appendChild(pill);
            if (status.message) container.appendChild(el("span", "muted", ` ${status.message}`));
        }

        function renderGameContext(container, ctx) {
            container.replaceChildren();
            const list = el("ul");
            const row = (label, valueNode) => {
                const li = el("li");
                li.appendChild(el("span", null, `${label}: `));
                li.appendChild(valueNode);
                list.appendChild(li);
            };
            row("Version", el("span", null, ctx.version));
            row("Unity Version", el("span", null, ctx.unity_version));
            row("Render Pipeline", el("span", null, ctx.render_pipeline || "Built-in"));
            container.appendChild(list);
        }

        // -- property editors ------------------------------------------------
        const INT_KINDS = new Set(["int", "long", "vector2int", "vector3int", "rectint", "boundsint", "color32"]);
        const FIELD_SPECS = {
            vector2: ["x", "y"],
            vector3: ["x", "y", "z"],
            vector4: ["x", "y", "z", "w"],
            vector2int: ["x", "y"],
            vector3int: ["x", "y", "z"],
            quaternion: ["x", "y", "z", "w"],
            rect: ["x", "y", "width", "height"],
            rectint: ["x", "y", "width", "height"],
            color: ["r", "g", "b", "a"],
            color32: ["r", "g", "b", "a"],
        };
        const MATRIX_FIELDS = [];
        for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) MATRIX_FIELDS.push(`m${r}${c}`);

        // Only write into an input the user is not currently editing.
        function setInputValue(input, value) {
            if (document.activeElement === input) return;
            input.value = value;
        }

        function numberInput(value, isInt) {
            const input = el("input");
            input.type = "number";
            input.step = isInt ? "1" : "any";
            input.value = value;
            return input;
        }

        function fieldGroup(fields, values, isInt) {
            // A row of labeled number inputs, e.g. "x [0] y [1] z [-10]".
            const wrap = el("span", "field-group");
            const inputs = {};
            for (const field of fields) {
                wrap.appendChild(el("span", "field-label", field));
                const input = numberInput(values[field], isInt);
                inputs[field] = input;
                wrap.appendChild(input);
            }
            const getValue = () => Object.fromEntries(fields.map(f => [f, isInt ? parseInt(inputs[f].value, 10) : parseFloat(inputs[f].value)]));
            const setValue = (value) => { for (const field of fields) setInputValue(inputs[field], value[field]); };
            return { node: wrap, inputs, getValue, setValue };
        }

        function colorCss(kind, value) {
            const scale = kind === "color" ? 255 : 1;
            const to255 = (v) => Math.max(0, Math.min(255, Math.round(v * scale)));
            return `rgba(${to255(value.r)}, ${to255(value.g)}, ${to255(value.b)}, ${kind === "color" ? value.a : value.a / 255})`;
        }

        // Builds the editor UI for one property. Returns {node, getValue, setValue}:
        // getValue() produces the JSON value to send to the backend (it may throw for
        // locally-invalid input, e.g. malformed JSON); setValue(value) updates the
        // inputs in place from a fresh backend value, skipping focused inputs.
        function buildEditor(prop) {
            const kind = prop.kind;
            const isInt = INT_KINDS.has(kind);

            if (kind === "bool") {
                const input = el("input");
                input.type = "checkbox";
                input.checked = prop.value;
                return { node: input,  getValue: () => input.checked,  setValue: (value) => { if (document.activeElement !== input) input.checked = value; }, };
            }

            if (kind === "int" || kind === "long" || kind === "float" || kind === "double") {
                const input = numberInput(prop.value, isInt);
                return { node: input,  getValue: () => isInt ? parseInt(input.value, 10) : parseFloat(input.value),  setValue: (value) => setInputValue(input, value), };
            }

            if (kind === "string" || kind === "char") {
                const input = el("input");
                input.type = "text";
                input.value = prop.value;
                if (kind === "char") { input.maxLength = 1; input.style.width = "2rem"; }
                return { node: input, getValue: () => input.value, setValue: (value) => setInputValue(input, value) };
            }

            if (kind === "enum") {
                const select = el("select");
                for (const [optionName, optionValue] of Object.entries(prop.options)) {
                    const opt = el("option", null, optionName);
                    opt.value = optionValue;
                    if (optionValue === prop.value) opt.selected = true;
                    select.appendChild(opt);
                }
                return {
                    node: select,
                    getValue: () => parseInt(select.value, 10),
                    setValue: (value) => setInputValue(select, value),
                };
            }

            if (kind in FIELD_SPECS) {
                const group = fieldGroup(FIELD_SPECS[kind], prop.value, isInt);
                if (kind === "color" || kind === "color32") {
                    const wrap = el("span", "field-group");
                    const swatch = el("span", "color-swatch");
                    swatch.style.background = colorCss(kind, prop.value);
                    wrap.appendChild(swatch);
                    wrap.appendChild(group.node);
                    return {
                        node: wrap,
                        getValue: () => {
                            const value = group.getValue();
                            swatch.style.background = colorCss(kind, value);
                            return value;
                        },
                        setValue: (value) => {
                            group.setValue(value);
                            swatch.style.background = colorCss(kind, value);
                        },
                    };
                }
                return group;
            }

            if (kind === "matrix4x4") {
                const grid = el("span", "matrix-grid");
                const inputs = {};
                for (const field of MATRIX_FIELDS) {
                    const input = numberInput(prop.value[field], false);
                    inputs[field] = input;
                    grid.appendChild(input);
                }
                return {
                    node: grid,
                    getValue: () => Object.fromEntries(MATRIX_FIELDS.map(f => [f, parseFloat(inputs[f].value)])),
                    setValue: (value) => { for (const field of MATRIX_FIELDS) setInputValue(inputs[field], value[field]); },
                };
            }

            if (kind === "bounds" || kind === "boundsint") {
                const keys = kind === "bounds" ? ["center", "extent"] : ["position", "size"];
                const fields = ["x", "y", "z"];
                const wrap = el("span", "field-group");
                const groups = {};
                for (const key of keys) {
                    wrap.appendChild(el("span", "field-label", `${key}:`));
                    const group = fieldGroup(fields, prop.value[key], isInt);
                    groups[key] = group;
                    wrap.appendChild(group.node);
                }
                return {
                    node: wrap,
                    getValue: () => Object.fromEntries(keys.map(k => [k, groups[k].getValue()])),
                    setValue: (value) => { for (const key of keys) groups[key].setValue(value[key]); },
                };
                // fixed:
            }

            // gradient / array / dictionary / object: edit as raw JSON.
            const input = el("input", "json-input");
            input.type = "text";
            input.value = JSON.stringify(prop.value);
            return {
                node: input,
                getValue: () => JSON.parse(input.value),
                setValue: (value) => setInputValue(input, JSON.stringify(value)),
            };
        }

        function renderProperty(objectId, componentId, prop) {
            const row = el("div", "prop-row");
            row.appendChild(el("span", "prop-label", prop.label));
            row.appendChild(el("span", "prop-kind", prop.read_only ? `${prop.kind} (read-only)` : prop.kind));

            const source = prop.source || "field";
            const sourceTag = el("span", `prop-source prop-source-${source}`, `[${source}]`);
            if (source === "field") sourceTag.title = `field: ${prop.member || prop.label}`;
            else if (source === "accessor") sourceTag.title = `get: ${prop.getter || "?"} / set: ${prop.setter || "(none)"}`;
            else sourceTag.title = "synthetic - value comes from a custom per-component handler on the agent";
            row.appendChild(sourceTag);

            const editor = buildEditor(prop);
            row.appendChild(editor.node);

            const update = (newProp) => editor.setValue(newProp.value);

            const inputs = editor.node.matches("input, select") ? [editor.node] : [...editor.node.querySelectorAll("input, select")];
            if (prop.read_only) {
                for (const input of inputs) input.disabled = true;
                return { row, update };
            }

            const commit = async () => {
                let value;
                try {
                    value = editor.getValue();
                } catch (e) {
                    flash(row, false);
                    row.title = `Invalid value: ${e.message}`;
                    return;
                }
                try {
                    await postJson("/api/set_property", {
                        object_id: objectId,
                        component_id: componentId,
                        property: {
                            ...prop,
                            value: value,
                        }
                    });
                    row.title = "";
                    flash(row, true);
                } catch (e) {
                    row.title = e.message;
                    flash(row, false);
                }
            };
            for (const input of inputs) input.addEventListener("change", commit);
            return { row, update };
        }

        // -- scene tree (keyed / incremental) --------------------------------
        // A "signature" captures everything about a property list except the values. matching signatures mean rows can be updated in place, otherwise rebuild.
        function propsSignature(properties) {
            return JSON.stringify(properties.map(p => [p.label, p.kind, p.read_only, p.source ?? null, p.options ?? null]));
        }

        function setComponentProperties(entry, properties) {
            const signature = propsSignature(properties);
            if (entry.signature === signature) {
                for (const prop of properties) entry.rows.get(prop.label)?.update(prop);
                return;
            }
            entry.signature = signature;
            entry.rows = new Map();
            entry.body.replaceChildren();
            if (!properties.length) {
                entry.body.appendChild(el("div", "muted", "(no properties)"));
            }
            for (const prop of properties) {
                const rendered = renderProperty(entry.objectId, entry.componentId, prop);
                entry.rows.set(prop.label, rendered);
                entry.body.appendChild(rendered.row);
            }
        }

        function updateComponentHeader(entry, objectId, component) {
            entry.objectId = objectId;
            entry.nameEl.textContent = component.name;
            entry.typeEl.textContent = `    id=${component.id} | type=${component.type}`;
            const hasToggle = component.enabled !== null && component.enabled !== undefined;
            entry.enabledCheckbox.style.display = hasToggle ? "" : "none";
            if (hasToggle && document.activeElement !== entry.enabledCheckbox) {
                entry.enabledCheckbox.checked = component.enabled;
            }
        }

        function createComponent(objectId, component) {
            const details = el("details", "component");
            details.open = component.expanded;

            const summary = el("summary");
            const checkbox = el("input");
            checkbox.type = "checkbox";
            checkbox.addEventListener("click", (e) => e.stopPropagation());
            checkbox.addEventListener("change", async () => {
                try {
                    await postJson("/api/set_component_enabled", {
                        object_id: entry.objectId,
                        component_id: component.id,
                        enabled: checkbox.checked,
                    });
                    flash(summary, true);
                } catch (e) {
                    checkbox.checked = !checkbox.checked;
                    summary.title = e.message;
                    flash(summary, false);
                }
            });
            summary.appendChild(checkbox);
            summary.appendChild(document.createTextNode(" "));
            const nameEl = el("span", null, component.name);
            summary.appendChild(nameEl);
            const typeEl = el("span", "node-meta", `    id=${component.id} | type=${component.type}`);
            summary.appendChild(typeEl);
            details.appendChild(summary);

            const body = el("div", "component-body");
            details.appendChild(body);

            const entry = {
                details, summary, body, nameEl, typeEl,
                enabledCheckbox: checkbox,
                objectId,
                componentId: component.id,
                signature: null,
                rows: new Map(),
            };
            componentEls.set(component.id, entry);
            updateComponentHeader(entry, objectId, component);
            setComponentProperties(entry, component.properties ?? []);
            return entry;
        }

        function nodeMetaText(node) {
            const meta = [`id=${node.id}`];
            if (node.data.tag !== "Untagged") meta.push(`tag=${node.data.tag}`);
            const layerName = layerNames[node.data.layer];
            meta.push(layerName ? `layer=${node.data.layer} (${layerName})` : `layer=${node.data.layer}`);
            if (node.data.is_static) meta.push("static");
            if (node.children.length) meta.push(`${node.children.length} child${node.children.length === 1 ? "" : "ren"}`);
            return `  ${meta.join(" | ")}`;
        }

        function updateNodeHeader(entry, node) {
            entry.nameEl.textContent = node.name;
            entry.metaEl.textContent = nodeMetaText(node);
            entry.details.classList.toggle("inactive", !node.data.active);
            if (document.activeElement !== entry.activeCheckbox) {
                entry.activeCheckbox.checked = node.data.active;
            }
            entry.componentsLabel.style.display = node.data.components.length ? "" : "none";
            entry.childrenLabel.style.display = node.children.length ? "" : "none";
        }

        function createNode(node) {
            const details = el("details", "node");
            details.open = true;

            const summary = el("summary");
            const activeCheckbox = el("input");
            activeCheckbox.type = "checkbox";
            activeCheckbox.title = "Active";
            activeCheckbox.addEventListener("click", (e) => e.stopPropagation());
            activeCheckbox.addEventListener("change", async () => {
                try {
                    await postJson("/api/set_active", { object_id: node.id, active: activeCheckbox.checked });
                    details.classList.toggle("inactive", !activeCheckbox.checked);
                    flash(summary, true);
                } catch (e) {
                    activeCheckbox.checked = !activeCheckbox.checked;
                    summary.title = e.message;
                    flash(summary, false);
                }
            });
            summary.appendChild(activeCheckbox);
            summary.appendChild(document.createTextNode(" "));
            const nameEl = el("b", null, node.name);
            summary.appendChild(nameEl);
            const metaEl = el("span", "node-meta", "");
            summary.appendChild(metaEl);
            details.appendChild(summary);

            const body = el("div", "node-body");
            const componentsLabel = el("div", "section-label", "Components:");
            const componentsWrap = el("div");
            const childrenLabel = el("div", "section-label", "Children:");
            const childrenWrap = el("div");
            body.append(componentsLabel, componentsWrap, childrenLabel, childrenWrap);
            details.appendChild(body);

            const entry = { details, summary, nameEl, metaEl, activeCheckbox, componentsLabel, componentsWrap, childrenLabel, childrenWrap };
            nodeEls.set(node.id, entry);
            return entry;
        }

        // Fix to prevent page from scrolling up when new structure given.
        function place(container, node, index) {
            if (container.children[index] === node) return;
            container.insertBefore(node, container.children[index] ?? null);
        }

        // Walks the incomming tree, reuses existing elements and creates missing ones.
        // Property values only changed when their information is set/included, otherwise not changed/empty.
        function reconcileNode(node, container, index, seenNodes, seenComponents, includeProperties) {
            seenNodes.add(node.id);
            let entry = nodeEls.get(node.id);
            if (!entry) entry = createNode(node);
            updateNodeHeader(entry, node);

            node.data.components.forEach((component, i) => {
                seenComponents.add(component.id);
                let compEntry = componentEls.get(component.id);
                if (!compEntry) {
                    compEntry = createComponent(node.id, component);
                } else {
                    updateComponentHeader(compEntry, node.id, component);
                    if (includeProperties) setComponentProperties(compEntry, component.properties ?? []);
                }
                place(entry.componentsWrap, compEntry.details, i);
            });

            node.children.forEach((child, i) => {
                reconcileNode(child, entry.childrenWrap, i, seenNodes, seenComponents, includeProperties);
            });

            place(container, entry.details, index);
        }

        // Keyed scene registry - keyed by scene name so expand/collapse state and
        // in-progress edits survive live updates. Unity can have several scenes loaded at once.
        const sceneEls = new Map(); // scene name -> {section, nameEl, emptyMsg, rootsWrap}
        let scenesContainer = null;

        function ensureScenesContainer() {
            if (scenesContainer) return scenesContainer;
            scenesContainer = document.getElementById("scenes");
            scenesContainer.classList.remove("muted");
            scenesContainer.replaceChildren();
            return scenesContainer;
        }

        function createScene(scene) {
            const section = el("div", "scene");
            const header = el("div", "scene-header", "Scene: ");
            const nameEl = el("b", null, "");
            header.appendChild(nameEl);
            const emptyMsg = el("div", "muted", "(empty scene)");
            emptyMsg.style.display = "none";
            const rootsWrap = el("div");
            section.append(header, emptyMsg, rootsWrap);
            const entry = { section, nameEl, emptyMsg, rootsWrap };
            sceneEls.set(scene.name, entry);
            return entry;
        }

        function applyScenes(scenes, includeProperties) {
            const container = ensureScenesContainer();

            const seenNodes = new Set();
            const seenComponents = new Set();
            const seenScenes = new Set();

            scenes.forEach((scene, i) => {
                seenScenes.add(scene.name);
                let entry = sceneEls.get(scene.name);
                if (!entry) entry = createScene(scene);
                entry.nameEl.textContent = scene.name;
                entry.emptyMsg.style.display = scene.roots.length ? "none" : "";
                scene.roots.forEach((root, j) => {
                    reconcileNode(root, entry.rootsWrap, j, seenNodes, seenComponents, includeProperties);
                });
                place(container, entry.section, i);
            });

            // Drop elements for any scene / node / component that no longer exists.
            for (const [name, entry] of sceneEls) {
                if (!seenScenes.has(name)) { entry.section.remove(); sceneEls.delete(name); }
            }
            for (const [id, entry] of nodeEls) {
                if (!seenNodes.has(id)) { entry.details.remove(); nodeEls.delete(id); }
            }
            for (const [id, entry] of componentEls) {
                if (!seenComponents.has(id)) { entry.details.remove(); componentEls.delete(id); }
            }
        }

        function applyProperties(components) {
            for (const [componentId, properties] of Object.entries(components)) {
                const entry = componentEls.get(componentId);
                if (entry) setComponentProperties(entry, properties);
            }
        }

        // -- realtime updates ------------------------------------------------
        function setLive(on) {
            const pill = document.getElementById("live");
            pill.className = `pill ${on ? "ok" : "bad"}`;
            pill.textContent = on ? "LIVE: ON" : "LIVE: OFF";
        }

        function connectUpdates() {
            const proto = location.protocol === "https:" ? "wss" : "ws";
            const ws = new WebSocket(`${proto}://${location.host}/ws`);
            ws.onopen = () => setLive(true);
            ws.onmessage = (event) => {
                let msg;
                try { msg = JSON.parse(event.data); } catch { return; }
                if (msg.type === "status") renderStatus(document.getElementById("status"), msg.status);
                else if (msg.type === "structure") applyScenes(msg.scenes, false);
                else if (msg.type === "properties") applyProperties(msg.components);
            };
            ws.onclose = () => {
                setLive(false);
                setTimeout(connectUpdates, 1000);
            };
            ws.onerror = () => ws.close();
        }

        // -- initial load ----------------------------------------------------
        async function refresh() {
            const statusEl = document.getElementById("status");
            const ctxEl = document.getElementById("game-context");
            const sceneEl = document.getElementById("scenes");

            fetchJson("/api/status").then(s => renderStatus(statusEl, s)).catch(e => showError(statusEl, "Status", e));

            // Load the game context first so the scene tree can show layer names.
            try {
                const ctx = await fetchJson("/api/game_context");
                layerNames = ctx.layers || {};
                renderGameContext(ctxEl, ctx);
            } catch (e) {
                layerNames = {};
                showError(ctxEl, "Game Context", e);
            }

            try {
                applyScenes(await fetchJson("/api/loaded_scenes"), true);
            } catch (e) {
                scenesContainer = null; // showError blows away the container; rebuild it next time
                sceneEls.clear();
                showError(sceneEl, "Loaded Scenes", e);
            }
        }

        function setAllDetails(open) {
            for (const details of document.querySelectorAll("#scenes details")) details.open = open;
        }

        document.getElementById("refresh").addEventListener("click", refresh);
        document.getElementById("expand-all").addEventListener("click", () => setAllDetails(true));
        document.getElementById("collapse-all").addEventListener("click", () => setAllDetails(false));
        refresh();
        connectUpdates();
    </script>
</body>
</html>
